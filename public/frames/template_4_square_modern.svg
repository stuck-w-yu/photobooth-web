<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Cosmic Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </radialGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neonGlowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Mask for Holes -->
  <mask id="photoGridHoles">
    <rect width="800" height="800" fill="white" />
    <!-- Holes -->
    <rect x="35" y="35" width="330" height="280" fill="black" />
    <rect x="435" y="35" width="330" height="280" fill="black" />
    <rect x="35" y="435" width="330" height="280" fill="black" />
    <rect x="435" y="435" width="330" height="280" fill="black" />
  </mask>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" mask="url(#photoGridHoles)" />

  <!-- Grid Lines -->
  <line x1="400" y1="20" x2="400" y2="780" stroke="#334155" stroke-width="1" />
  <line x1="20" y1="375" x2="780" y2="375" stroke="#334155" stroke-width="1" />

  <!-- Photo Borders (Overlay) -->
  <rect x="30" y="30" width="340" height="290" rx="10" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlowBlue)" opacity="0.6" />
  <rect x="430" y="30" width="340" height="290" rx="10" fill="none" stroke="#c084fc" stroke-width="2" filter="url(#neonGlowBlue)" opacity="0.6" />
  <rect x="30" y="430" width="340" height="290" rx="10" fill="none" stroke="#c084fc" stroke-width="2" filter="url(#neonGlowBlue)" opacity="0.6" />
  <rect x="430" y="430" width="340" height="290" rx="10" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlowBlue)" opacity="0.6" />

  <!-- Center Decoration -->
  <circle cx="400" cy="375" r="30" fill="#0f172a" stroke="#fff" stroke-width="2" />
  <text x="400" y="382" text-anchor="middle" font-family="Arial" font-size="20" fill="#fff">✦</text>

  <!-- Bottom Branding -->
  <rect x="0" y="730" width="800" height="70" fill="#020617" />
  <text x="400" y="775" text-anchor="middle" font-family="Courier New" font-weight="bold" font-size="32" fill="white" letter-spacing="6" filter="url(#neonGlowBlue)">
    PHOTOBOOTH
  </text>
  
  <!-- Tech Accents -->
  <rect x="10" y="10" width="20" height="20" fill="none" stroke="#fff" stroke-width="1" />
  <rect x="770" y="10" width="20" height="20" fill="none" stroke="#fff" stroke-width="1" />
  <rect x="10" y="770" width="20" height="20" fill="none" stroke="#fff" stroke-width="1" />
  <rect x="770" y="770" width="20" height="20" fill="none" stroke="#fff" stroke-width="1" />

</svg>