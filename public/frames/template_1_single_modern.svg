<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Cosmic Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#2e1065;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </radialGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Star Pattern -->
    <pattern id="starPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="50" cy="50" r="1" fill="white" opacity="0.5"/>
      <circle cx="10" cy="10" r="0.5" fill="white" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background with HOLE using mask -->
  <mask id="photoHole">
    <rect width="800" height="800" fill="white" />
    <!-- The Hole: x: 110, y: 110, w: 580, h: 440 -->
    <rect x="110" y="110" width="580" height="440" fill="black" />
  </mask>

  <!-- Draw Backgrounds masked -->
  <rect width="800" height="800" fill="url(#bgGrad)" mask="url(#photoHole)" />
  <rect width="800" height="800" fill="url(#starPattern)" mask="url(#photoHole)" />

  <!-- Photo Area Border (Decorative) -->
  <rect x="105" y="105" width="590" height="450" rx="15" fill="none" stroke="#d946ef" stroke-width="4" filter="url(#neonGlow)" opacity="0.8" />
  
  <!-- Decorative Frame Accents -->
  <path d="M 90 90 L 150 90 M 90 90 L 90 150" stroke="#a855f7" stroke-width="4" fill="none" filter="url(#neonGlow)" />
  <path d="M 710 90 L 650 90 M 710 90 L 710 150" stroke="#a855f7" stroke-width="4" fill="none" filter="url(#neonGlow)" />
  <path d="M 90 570 L 150 570 M 90 570 L 90 510" stroke="#a855f7" stroke-width="4" fill="none" filter="url(#neonGlow)" />
  <path d="M 710 570 L 650 570 M 710 570 L 710 510" stroke="#a855f7" stroke-width="4" fill="none" filter="url(#neonGlow)" />

  <!-- Text / Branding -->
  <text x="400" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="48" fill="white" letter-spacing="8" filter="url(#neonGlow)">
    COSMIC
  </text>
  <text x="400" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#e879f9" letter-spacing="4">
    MEMORIES
  </text>

  <!-- Date Placeholder -->
  <rect x="250" y="730" width="300" height="2" fill="#ffffff" opacity="0.3" />
</svg>