<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgVapor" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:#3b0764;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c4a6e;stop-opacity:1" />
    </linearGradient>
    <mask id="holeVapor4">
         <rect width="800" height="800" fill="white" />
         <!-- Holes black -->
         <rect x="35" y="35" width="330" height="280" fill="black" />
         <rect x="435" y="35" width="330" height="280" fill="black" />
         <rect x="35" y="435" width="330" height="280" fill="black" />
         <rect x="435" y="435" width="330" height="280" fill="black" />
    </mask>
  </defs>

  <!-- Background with Holes using MASK -->
  <rect width="800" height="800" fill="url(#bgVapor)" mask="url(#holeVapor4)" />

  <!-- Neon Borders -->
  <rect x="30" y="30" width="340" height="290" fill="none" stroke="#22d3ee" stroke-width="4" />
  <rect x="430" y="30" width="340" height="290" fill="none" stroke="#e879f9" stroke-width="4" />
  <rect x="30" y="430" width="340" height="290" fill="none" stroke="#e879f9" stroke-width="4" />
  <rect x="430" y="430" width="340" height="290" fill="none" stroke="#22d3ee" stroke-width="4" />

  <!-- Center Graphic -->
  <circle cx="400" cy="375" r="40" fill="#facc15" />
  <text x="400" y="385" text-anchor="middle" font-size="30">📼</text>

  <!-- Bottom Text -->
  <text x="400" y="760" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold" font-size="36" fill="#f0abfc" style="text-shadow: 2px 2px #ec4899;">
    RETRO WAVE
  </text>
  
  <!-- Grid Lines Decoration -->
  <line x1="0" y1="780" x2="800" y2="780" stroke="#22d3ee" stroke-width="2" />
  <line x1="0" y1="790" x2="800" y2="790" stroke="#e879f9" stroke-width="2" />

</svg>
