<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with Holes using fill-rule evenodd -->
  <path fill="#fff7ed" fill-rule="evenodd" 
        d="M0 0 H800 V800 H0 Z 
           M35 35 H365 V315 H35 Z 
           M435 35 H765 V315 H435 Z 
           M35 435 H365 V715 H35 Z 
           M435 435 H765 V715 H435 Z" 
  />

  <!-- Soft Borders -->
  <rect x="30" y="30" width="340" height="290" rx="15" fill="none" stroke="#fdba74" stroke-width="5" />
  <rect x="430" y="30" width="340" height="290" rx="15" fill="none" stroke="#fca5a5" stroke-width="5" />
  <rect x="30" y="430" width="340" height="290" rx="15" fill="none" stroke="#fca5a5" stroke-width="5" />
  <rect x="430" y="430" width="340" height="290" rx="15" fill="none" stroke="#fdba74" stroke-width="5" />

  <!-- Doodles -->
  <text x="380" y="380" font-size="40">🐻</text>
  <circle cx="50" cy="50" r="15" fill="#fef08a" />
  <circle cx="750" cy="50" r="15" fill="#fef08a" />
  <circle cx="50" cy="750" r="15" fill="#fef08a" />
  <circle cx="750" cy="750" r="15" fill="#fef08a" />

  <!-- Text -->
  <text x="400" y="760" text-anchor="middle" font-family="Comic Sans MS, cursive" font-weight="bold" font-size="42" fill="#fb923c">
    Happy Day!
  </text>
  
  <!-- Scribbles -->
  <path d="M380 30 Q400 10 420 30" stroke="#fca5a5" stroke-width="3" fill="none" />
  <path d="M380 720 Q400 700 420 720" stroke="#fca5a5" stroke-width="3" fill="none" />

</svg>
