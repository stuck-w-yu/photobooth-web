<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Layout 4 map: 1:35,35,330,280 ... -->
  
  <!-- Background with Holes using fill-rule evenodd is ALREADY CORRECT here hopefully.
       Confirming coordinates:
       Box 1: 35,35 330,280 -> 365, 315
       Box 2: 435,35 330,280 -> 765, 315
  -->
  <path fill="#ffffff" fill-rule="evenodd" 
        d="M0 0 H800 V800 H0 Z 
           M35 35 H365 V315 H35 Z 
           M435 35 H765 V315 H435 Z 
           M35 435 H365 V715 H35 Z 
           M435 435 H765 V715 H435 Z" 
  />

  <!-- Framing the holes -->
  <rect x="30" y="30" width="340" height="290" fill="none" stroke="#000" stroke-width="4" />
  <rect x="430" y="30" width="340" height="290" fill="none" stroke="#000" stroke-width="4" />
  <rect x="30" y="430" width="340" height="290" fill="none" stroke="#000" stroke-width="4" />
  <rect x="430" y="430" width="340" height="290" fill="none" stroke="#000" stroke-width="4" />

  <!-- Center Cross -->
  <line x1="400" y1="20" x2="400" y2="780" stroke="#000" stroke-width="1" />
  <line x1="20" y1="375" x2="780" y2="375" stroke="#000" stroke-width="1" />
  
  <!-- Branding Board at Bottom -->
  <rect x="250" y="740" width="300" height="40" fill="#000" />
  <text x="400" y="768" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#fff" letter-spacing="4">
    PHOTOBOOTH
  </text>
  
  <!-- Corner elements -->
  <rect x="0" y="0" width="20" height="20" fill="#000" />
  <rect x="780" y="0" width="20" height="20" fill="#000" />
  <rect x="0" y="780" width="20" height="20" fill="#000" />
  <rect x="780" y="780" width="20" height="20" fill="#000" />

</svg>
